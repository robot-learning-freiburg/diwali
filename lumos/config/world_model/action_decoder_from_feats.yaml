defaults:
  - dcd_action: ../inv_dyna/decoder_mlp
  - amp: default
  - optimizer: adamw
  - optimizer@scheduler: adamw_scheduler
  - loss: default
  - _self_

_target_: lumos.world_models.action_decoder_from_feats.ActionDecoderFromFeats
_recursive_: false
name: action_decoder_from_feats
train_batch_size: ${datamodule.train_batch_size}
val_batch_size: ${datamodule.val_batch_size}

# Dimensions of precomputed lat_actions and features from features.pkl
latent_action_dim: 16
feature_dim: 2048
robot_obs_dim: 0

dcd_action:
  in_dim: 2176
  mlp_layers: [1024, 512, 512, 256, 256]
