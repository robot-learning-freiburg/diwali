defaults:
  - encoder: cnn_encoder_64
  - decoder: cnn_decoder_64
  - rssm: default
  - amp: default
  - optimizer: adamw
  - loss: default

_target_: lumos.world_models.dreamer_v2_noact.DreamerV2
_recursive_: false
name: dreamer_v2_noact
train_batch_size: ${datamodule.train_batch_size}
val_batch_size: ${datamodule.val_batch_size}
rebalance_loss: false

use_gripper_camera: ${datamodule.use_gripper_camera}
with_proprio: false
robot_dim: ${datamodule.proprioception_dims.n_state_obs}