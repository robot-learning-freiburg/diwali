defaults:
  - wm_disk_dataset@train: noact
  - wm_disk_dataset@val: noact

root_data_dir: ${data_dir}/calvin/real_arm_64
root_points_displacement_data_dir: null
pseudo_masked_val_act: False

train:
  dataset_dir: ${..root_data_dir}/training
  points_displacement_data_dir: ${optional_join:${..root_points_displacement_data_dir},training}
  index_file: "ep_start_end_ids.npy"
  cache_file: "cached_arm_real.pkl"

val:
  dataset_dir: ${..root_data_dir}/validation
  points_displacement_data_dir: ${optional_join:${..root_points_displacement_data_dir},validation}
  index_file: "ep_start_end_ids.npy"
  cache_file: "cached_arm_real.pkl"