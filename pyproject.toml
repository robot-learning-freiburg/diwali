[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diwali"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.5.1", "torchvision==0.20.1", "numpy<2", "lightning<2.6",
  "hydra-core", "hydra-colorlog", "wandb", "einops", "matplotlib",
  "opencv-python", "imageio[ffmpeg]", "gym==0.26.2", "scipy",
  "stable-baselines3==2.3.2", "h5py", "scikit-learn",
]

[tool.setuptools.packages.find]
include = ["diwali*"]
namespaces = true

[tool.black]
# https://github.com/psf/black
line-length = 120
target-version = ["py310"]
exclude = "(.eggs|.git|.hg|.mypy_cache|.nox|.tox|.venv|.svn|_build|buck-out|build|dist)"

[tool.isort]
profile = "black"
line_length = 120
force_sort_within_sections = "True"
order_by_type = "False"