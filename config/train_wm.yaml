defaults:
  - setup
  - logger: wandb
  - ../lumos/config/tensor_cores@_global_
  - ../lumos/config/callbacks@callbacks: wm_default
  - ../lumos/config/datamodule@datamodule: static_gripper_cam
  - ../lumos/config/world_model@world_model: dreamer_v2
  - ../lumos/config/trainer@trainer: wm_default
  - _self_

  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

datamodule:
  root_data_dir: ${root}/dataset/task_D_D_64
  action_chunk_data_dir: ${root}/dataset/task_D_D_ac5
  action_chunk_size: 5
  train_batch_size: 50
  val_batch_size: 50
  use_cached_data: false

log_dir: ${oc.env:DIWALI_LOG_DIR}/wm/
script: wm
  
hydra:
  run:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - log_dir
          - datamodule.root_data_dir 