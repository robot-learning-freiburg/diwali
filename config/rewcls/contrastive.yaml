skill_name: "close_drawer"
device: "cuda:0"
logdir: ${oc.env:DIWALI_LOG_DIR}/rewcls/${wm_type}/${skill_name}/
comment: ""
wandb:
  entity: ${oc.env:DIWALI_WANDB_ENTITY}
  project: reward-classifier
  run: ${comment}-${skill_name}-contrastive-${wm_type}-${now:%H-%M-%S}
  dir: ${logdir}
# dataset paths
train_data_path: ${oc.env:DIWALI_DATA_DIR}/expert/feat-${wm_type}-900k-franka-50/${skill_name}/rewcls_train_mix_balanced_4.npz
val_data_path: null # ${oc.env:DIWALI_DATA_DIR}/expert/calvin-feat-50/${skill_name}/rewcls_val.npz
model_out_dir: ${logdir}
model_save_name: "model.pth"
# hyperparameters
batch_size: 32
num_epochs: 100
lr: 1e-6
temperature: 0.5
alpha: 0.5

wm_type: "LANOF"