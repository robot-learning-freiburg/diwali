defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: diwali.agent.finetune.train_mb_ppo_diffusion_agent_visionwm.TrainMBPPODiffusionAgent

name: ${env_name}_ft_diffusion_mlp_feat_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}
logdir: ${oc.env:DIWALI_LOG_DIR}/real-finetune-feat/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}

base_policy_dir: null
base_policy_path: ${oc.env:DIWALI_LOG_DIR}/calvin-pretrain-feat/${env_name}_pre_diffusion_mlp_feat_ta1_td20/${base_policy_dir}/checkpoint/state_5000.pt
normalization_path: null

action_decoder_path: /export/home/lagandua/projects/diwali/logs/runs/2026-09-14/22-43-20/model_weights/last.ckpt
wm_ckpt_path: ${oc.env:DIWALI_LOG_DIR}/runs/2026-09-09/10-54-56_diwali_job/model_weights/900000.ckpt

seed: 42
device: cuda:0
env_name: close_drawer
env_type: real
obs_dim: 2048
action_dim: 16
denoising_steps: 20
ft_denoising_steps: 10
cond_steps: 1
horizon_steps: 1
act_steps: ${horizon_steps}

comment: ""
offline_method: true
rgb_obs: true

wandb:
  entity: ${oc.env:DIWALI_WANDB_ENTITY}
  project: diwali-${env_name}-finetune
  run: ${comment}-vision-feat-${now:%H-%M-%S}-${name}
  dir: ${logdir}

wm_type: diwali

wm:
  _target_: diwali.wm.wrapper.visionwm_cls_noact.VisionWMWrapper
  ckpt_path: ${wm_ckpt_path}
  device: ${device}
  stats_path: ${oc.env:DIWALI_DATA_DIR}/calvin/real_64/training/statistics.yaml
  temperature: 1.0
  skill: ${env_name}
  rew_cls_path: ${oc.env:DIWALI_LOG_DIR}/rewcls/LANOF/${env_name}/model.pth
  wm_type: ${wm_type}

action_decoder:
  ckpt_path: ${action_decoder_path}

env_runner:
  _target_: diwali.env.runner.visionwm_real.EnvRunner

env:
  n_envs: 50
  n_render: -1
  n_eval_episodes: 5
  render_fps: 8
  name: ${env_name}
  env_type: ${env_type}
  best_reward_threshold_for_success: 1
  max_episode_steps: 75
  save_video: true
  load_scene_from_dataset: null
  # RGB start frames for WM imagination / training resets. Extract with:
  #   python scripts/dataset/extract_validation_starts_img.py
  eval_scene_from_dataset: ${oc.env:DIWALI_DATA_DIR}/expert/real-validation-starts/${env_name}/val_starts_1.npz
  n_obs_steps: 1
  n_action_steps: ${horizon_steps}

train:
  n_train_itr: 670
  n_critic_warmup_itr: 2
  n_steps: 30 # ${eval:'${env.max_episode_steps} / ${horizon_steps}'}
  gamma: 0.999
  actor_lr: 1e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 10
    min_lr: 1e-5
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 100
  val_freq: 25
  # No physical env. Set true to roll out in the world model and log decoded RGB.
  eval_in_sim: false
  render:
    freq: 26
    num: ${env.n_render}
  # PPO specific
  reward_scale_running: True
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 7500
  update_epochs: 10
  vf_coef: 0.5
  target_kl: 1
  bc_loss_coeff: 0.025
  use_bc_loss: True

model:
  _target_: diwali.model.diffusion.diffusion_ppo.PPODiffusion
  # HP to tune
  gamma_denoising: 0.99
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3
  randn_clip_value: 3
  min_sampling_denoising_std: 0.1
  min_logprob_denoising_std: 0.1
  #
  network_path: ${base_policy_path}
  actor:
    _target_: diwali.model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: diwali.model.common.critic.CriticObs
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  ft_denoising_steps: ${ft_denoising_steps}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
